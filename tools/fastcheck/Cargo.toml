[package]
name = "fastcheck"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
walkdir = "2"

[package]
name = "extract-comment"
version = "0.1.0"
edition = "2021"


[dependencies]
anyhow = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
syn = { version = "2", features = ["full","visit", "derive","printing","extra-traits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
fs_extra = "1.3.0"
quote = "1"